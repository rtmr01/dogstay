<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>Dog Stay</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "on-primary-container": "#9abab1",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#394563",
                        "on-surface-variant": "#414846",
                        "on-tertiary-fixed": "#0d1b36",
                        "tertiary-fixed-dim": "#b9c6ea",
                        "surface": "#fbf9f5",
                        "secondary-fixed": "#ffdbcd",
                        "background": "#fbf9f5",
                        "surface-variant": "#e4e2de",
                        "tertiary-fixed": "#d9e2ff",
                        "inverse-primary": "#accdc4",
                        "surface-bright": "#fbf9f5",
                        "on-secondary-container": "#76300d",
                        "primary-fixed": "#c8eae0",
                        "primary": "#16342e",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#360f00",
                        "surface-container-high": "#eae8e4",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#30312e",
                        "primary-fixed-dim": "#accdc4",
                        "on-surface": "#1b1c1a",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#a6b3d6",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#46645d",
                        "outline": "#717976",
                        "on-primary-fixed": "#01201a",
                        "surface-container-low": "#f5f3ef",
                        "surface-container-highest": "#e4e2de",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-dim": "#dbdad6",
                        "on-secondary-fixed-variant": "#77320e",
                        "on-tertiary-fixed-variant": "#3a4664",
                        "secondary-fixed-dim": "#ffb597",
                        "inverse-on-surface": "#f2f0ed",
                        "secondary-container": "#fd9a6f",
                        "surface-container": "#efeeea",
                        "tertiary": "#222f4b",
                        "secondary": "#964824",
                        "primary-container": "#2d4b44",
                        "on-primary-fixed-variant": "#2e4c45",
                        "on-background": "#1b1c1a",
                        "outline-variant": "#c1c8c5"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "card-gap": "16px",
                        "safe-area-bottom": "calc(env(safe-area-inset-bottom) + 12px)",
                        "nav-height": "calc(env(safe-area-inset-bottom) + 88px)",
                        "safe-area-top": "max(env(safe-area-inset-top), 16px)",
                        "touch-target-min": "48px",
                        "gutter": "20px",
                        "thumb-zone-padding": "32px"
                    },
                    "fontFamily": {
                        "headline-xl-mobile": ["Lexend"],
                        "body-md": ["Lexend"],
                        "headline-xl": ["Lexend"],
                        "button-text": ["Lexend"],
                        "headline-lg": ["Lexend"],
                        "label-sm": ["Lexend"]
                    },
                    "fontSize": {
                        "headline-xl-mobile": ["32px", { "lineHeight": "38px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "button-text": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-background text-on-background overflow-hidden overscroll-none h-screen w-full relative flex flex-col antialiased">
    
    <!-- Top Nav (Desktop) -->
    <div id="desktop-nav-container"></div>

    <!-- Main Content App -->
    <div id="app" class="flex-grow w-full h-full relative overflow-hidden">
        <!-- Pages will be rendered here -->
    </div>

    <!-- Bottom Nav (Mobile) -->
    <div id="bottom-nav-container"></div>

    <!-- Overlays -->
    <div id="search-overlay" class="overlay-container fixed inset-0 flex flex-col justify-start bg-surface/95 backdrop-blur-md pt-safe-area-top">
        <div class="px-gutter py-4 flex gap-3 items-center w-full">
            <button onclick="window.closeOverlay('search-overlay')" class="text-on-surface-variant p-2 rounded-full hover:bg-surface-container-low transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div class="flex-grow bg-surface-container-lowest rounded-xl shadow-sm border border-surface-variant p-2 flex items-center gap-2">
                <span class="material-symbols-outlined text-primary px-2">search</span>
                <input id="global-search-input" class="bg-transparent border-none focus:ring-0 w-full font-body-md text-body-md text-on-surface placeholder:text-outline p-0" placeholder="Search for parks, cafes, vets..." type="text" autofocus />
                <button data-action="open-filtro" class="text-on-surface-variant p-2 flex items-center">
                    <span class="material-symbols-outlined">tune</span>
                </button>
            </div>
        </div>
        <div id="search-results" class="flex-grow px-gutter overflow-y-auto">
            <!-- Recent searches could go here -->
        </div>
    </div>
    <div id="filtro-overlay" class="overlay-container fixed inset-0 flex flex-col justify-end bg-surface/50 backdrop-blur-sm">
        <div id="filtro-container" class="bg-surface h-[85vh] rounded-t-3xl shadow-[0_-8px_30px_rgba(13,27,54,0.1)] flex flex-col">
            <!-- Content injected here -->
        </div>
    </div>

    <div id="detalhe-overlay" class="overlay-container fixed inset-0 flex flex-col justify-end bg-surface/50 backdrop-blur-sm">
        <div id="detalhe-container" class="bg-surface h-[100vh] flex flex-col">
            <!-- Content injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
